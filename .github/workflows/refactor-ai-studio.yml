name: One-shot AI Studio Refactor

on:
  push:
    branches:
      - phase-2b-ai-studio-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ !contains(github.event.head_commit.message, 'refactor: extract AI Studio modules') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract AI Studio modules
        run: node scripts/refactor-ai-studio.cjs
      - name: Verify generated tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract AI Studio modules"
          git push origin HEAD:phase-2b-ai-studio-refactor
