name: One-shot Catalog Integrations Refactor

on:
  push:
    branches:
      - phase-2b-integrations-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ !contains(github.event.head_commit.message, 'refactor: extract SoundCloud and Spotify panels') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract catalog integration panels
        run: node scripts/refactor-catalog-integrations.cjs
      - name: Verify generated tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract SoundCloud and Spotify panels"
          git push origin HEAD:phase-2b-integrations-refactor
