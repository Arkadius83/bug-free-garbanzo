name: One-shot Tasks Publishing Refactor

on:
  push:
    branches:
      - phase-2b-tasks-publishing-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ !contains(github.event.head_commit.message, 'refactor: extract tasks and publishing modules') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize generated App call
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/refactor-tasks-publishing.cjs')
          s=p.read_text()
          a=s.index('const replacement=')
          b=s.index(';\ns=s.slice',a)
          replacement='const replacement=`        {activeView === "calendar" && TasksPage({tasks,taskTitle,setTaskTitle,taskPriority,setTaskPriority,taskAssignee,setTaskAssignee,taskDueAt,setTaskDueAt,activeReleaseId,createTask,taskMessage,runningTaskId,changeTaskStatus,runTaskAgent,meta,publishingQueue,metaQueueItemId,setMetaQueueItemId,metaDestinationByItem,setMetaDestinationByItem,publishMetaItem,releases,selectRelease,publishingPlatform,setPublishingPlatform,publishingCaptionId,setPublishingCaptionId,campaignPackItems,publishingMediaId,setPublishingMediaId,mediaGenerations,publishingDate,setPublishingDate,publishingMessage,addPublishingItem,changePublishingStatus,exportPublishingPack})}`'
          p.write_text(s[:a]+replacement+s[b:])
          PY
      - name: Extract Tasks and Publishing
        run: node scripts/refactor-tasks-publishing.cjs
      - name: Show generated App slice
        run: nl -ba src/App.tsx | sed -n '588,602p'
      - name: Verify generated tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract tasks and publishing modules"
          git push origin HEAD:phase-2b-tasks-publishing-refactor
