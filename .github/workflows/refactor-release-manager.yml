name: One-shot Release Manager Refactor

on:
  push:
    branches:
      - phase-2b-release-manager-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ !contains(github.event.head_commit.message, 'refactor: extract release manager modules') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract Release Manager modules
        run: node scripts/refactor-release-manager.cjs
      - name: Tighten callback types
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/releases/CampaignDraftPanel.tsx')
          s=p.read_text()
          s=s.replace('.map((model) =>', '.map((model: any) =>')
          s=s.replace('.map((release) =>', '.map((release: any) =>')
          s=s.replace('.map((item) =>', '.map((item: any) =>')
          s=s.replace('.map((next) =>', '.map((next: any) =>')
          p.write_text(s)
          p=Path('src/features/releases/ReleaseSourcePanel.tsx')
          s=p.read_text().replace('.map((asset) =>', '.map((asset: any) =>')
          p.write_text(s)
          PY
      - name: Verify generated tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract release manager modules"
          git push origin HEAD:phase-2b-release-manager-refactor
